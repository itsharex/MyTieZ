name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -count=1 ./internal/...

      - name: Run mygo vet
        run: go tool mygo vet .

      - name: Build Windows release
        run: go tool mygo build -platform windows/amd64,windows/arm64

      - name: Package release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $targets = @(
            @{ goarch = "amd64"; label = "x64" },
            @{ goarch = "arm64"; label = "arm64" }
          )
          foreach ($t in $targets) {
            $dir = "build/windows-$($t.goarch)"
            Get-ChildItem "$dir/mytiez-setup-*.exe" | ForEach-Object {
              $newName = $_.Name -replace "-$($t.goarch)\.exe$", "-$($t.label).exe"
              Copy-Item $_.FullName -Destination "dist/$newName"
            }
            $stage = "dist/portable-$($t.label)"
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            Copy-Item "$dir/MyTieZ.exe" -Destination "$stage/"
            New-Item -ItemType File -Force -Path "$stage/portable" | Out-Null
            Compress-Archive -Path "$stage/*" -DestinationPath "dist/MyTieZ-windows-$($t.label)-portable.zip" -Force
            Remove-Item -Recurse -Force $stage
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
